[package]
name = "wormhole-executors"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
# For contract code: no std on Wasm. hazmat-address unlocks Address::to_payload,
# used to bind the payee to the signed quote on-chain.
soroban-sdk = { workspace = true, features = ["hazmat-address"] }
executor-soroban-client = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
